[package]
name = "smaragd-sync-e2e"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "End-to-end tests: the real Smaragd sync client and engine against the real sync server"
repository = "https://github.com/smaragd-editor/smaragd-sync-e2e"
publish = false

# Its own repo: this crate links both the whole desktop app and the sync server,
# and neither the app's flatpak-vendored lockfile nor the server's Docker build
# should see the other's dependency tree.
[workspace]

[dev-dependencies]
smaragd = { git = "https://github.com/smaragd-editor/smaragd" }
smaragd-sync-protocol = { git = "https://github.com/smaragd-editor/smaragd-sync" }
smaragd-sync-server = { git = "https://github.com/smaragd-editor/smaragd-sync" }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
